# SVWS-EduGate Gateway (Data Plane)
# Skeleton in diesem Auftrag: nur OIDC-Tokenprüfung, Health und /ping (ADR-001/ADR-004).
# Proxy-/Mandanten-Auflösungs-/Audit-Logik folgt in einem späteren Auftrag.

quarkus.application.name=edugate-gateway
quarkus.http.port=8081

# --- Datasource (edugate_gateway_ro, nur lesend, ADR-001) ------------------
# Wird in diesem Auftrag noch nicht fachlich genutzt (kein Proxy/keine Mandanten-Auflösung),
# ist aber bereits vollständig konfiguriert, damit spätere Aufträge direkt darauf aufbauen.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${EDUGATE_GATEWAY_DB_USERNAME:edugate_gateway_ro}
# Default-Platzhalter nur für lokale Tests/Dev-Boot ohne .env; docker-compose setzt den
# echten Wert immer über EDUGATE_GATEWAY_DB_PASSWORD (siehe .env.example).
quarkus.datasource.password=${EDUGATE_GATEWAY_DB_PASSWORD:changeit}
quarkus.datasource.jdbc.url=jdbc:postgresql://${EDUGATE_DB_HOST:localhost}:${EDUGATE_DB_PORT:5432}/${EDUGATE_DB_NAME:edugate}
quarkus.datasource.health.enabled=true

# --- OIDC (Keycloak, ADR-005) -----------------------------------------------
quarkus.oidc.auth-server-url=${EDUGATE_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/edugate}
quarkus.oidc.client-id=${EDUGATE_OIDC_GATEWAY_CLIENT_ID:edugate-demo-client}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${EDUGATE_OIDC_ISSUER:any}
# In Produktion ist "any" nicht akzeptabel (siehe ausführlicher Kommentar in
# edugate-control-plane/application.properties) - der %prod-Override erzwingt einen expliziten
# Issuer und lässt das Gateway ohne EDUGATE_OIDC_ISSUER beim Start fehlschlagen (Issue #15).
%prod.quarkus.oidc.token.issuer=${EDUGATE_OIDC_ISSUER}
# Wie in der Control Plane: kein Discovery-Zwang und keine frühe JWKS-Auflösung, damit
# Requests ohne Token unabhängig von der Keycloak-Erreichbarkeit sauber mit 401 beantwortet
# werden (siehe ausführlicher Kommentar in edugate-control-plane/application.properties).
quarkus.oidc.discovery-enabled=false
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect
quarkus.oidc.end-session-path=/protocol/openid-connect/logout
quarkus.oidc.jwks.resolve-early=false

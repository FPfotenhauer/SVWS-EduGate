# SVWS-EduGate Control Plane
# Siehe architecture/ARCHITECTURE.md und architecture/adr/ für den verbindlichen Kontext.

quarkus.application.name=edugate-control-plane

# --- REST-Basis & OpenAPI --------------------------------------------------
quarkus.http.root-path=/
quarkus.smallrye-openapi.path=/admin/api/v1/openapi
quarkus.swagger-ui.path=/admin/api/v1/swagger-ui
# Swagger UI ist nur in Dev/Test eingebettet (Standardverhalten von Quarkus ohne
# always-include ist "nur im Dev-Modus") - im gepackten Produktions-Jar existiert die Route
# damit gar nicht erst (Issue #16).
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true
# Das OpenAPI-Dokument selbst (smallrye-openapi) registriert seine Route unabhängig von
# Swagger UI. In Produktion wird sie deshalb zusätzlich auf die Admin-Rolle beschränkt statt
# öffentlich erreichbar zu bleiben. Dies ist bewusst NICHT derselbe Fall wie der
# HTTP-Ebenen-Permission-Verzicht weiter unten: /admin/api/v1/openapi ist keine JAX-RS-Ressource
# mit RFC7807-Fehlerantworten, sondern eine Framework-Route ohne eigenen ExceptionMapper - eine
# einfache 401/403-Antwort auf dieser Route regressiert also keinen bestehenden Fehlervertrag.
%prod.quarkus.http.auth.permission.openapi.paths=/admin/api/v1/openapi,/admin/api/v1/openapi/*
%prod.quarkus.http.auth.permission.openapi.policy=openapi-admin-only
%prod.quarkus.http.auth.policy.openapi-admin-only.roles-allowed=dienstleister-admin

# --- Datasource "default" (edugate_control, RLS-gebunden, ADR-009) ---------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${EDUGATE_CONTROL_DB_USERNAME:edugate_control}
quarkus.datasource.password=${EDUGATE_CONTROL_DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${EDUGATE_DB_HOST:localhost}:${EDUGATE_DB_PORT:5432}/${EDUGATE_DB_NAME:edugate}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# --- Datasource "operator" (edugate_operator, nur via OperatorAccess) ------
quarkus.datasource."operator".db-kind=postgresql
quarkus.datasource."operator".username=${EDUGATE_OPERATOR_DB_USERNAME:edugate_operator}
quarkus.datasource."operator".password=${EDUGATE_OPERATOR_DB_PASSWORD}
quarkus.datasource."operator".jdbc.url=jdbc:postgresql://${EDUGATE_DB_HOST:localhost}:${EDUGATE_DB_PORT:5432}/${EDUGATE_DB_NAME:edugate}

# --- Datasource "migration" (nur Flyway; Superuser, nie zur Laufzeit von der
# Anwendung verwendet – siehe Kommentar in V1__initial_schema.sql) ----------
quarkus.datasource."migration".db-kind=postgresql
quarkus.datasource."migration".username=${EDUGATE_DB_ADMIN_USERNAME:postgres}
quarkus.datasource."migration".password=${EDUGATE_DB_ADMIN_PASSWORD}
quarkus.datasource."migration".jdbc.url=jdbc:postgresql://${EDUGATE_DB_HOST:localhost}:${EDUGATE_DB_PORT:5432}/${EDUGATE_DB_NAME:edugate}

quarkus.flyway.active=false
quarkus.flyway."operator".active=false
quarkus.flyway."migration".active=true
quarkus.flyway."migration".migrate-at-start=true
quarkus.flyway."migration".locations=classpath:db/migration
quarkus.flyway."migration".baseline-on-migrate=true

# --- OIDC (Keycloak, ADR-005) -----------------------------------------------
quarkus.oidc.auth-server-url=${EDUGATE_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/edugate}
quarkus.oidc.client-id=${EDUGATE_OIDC_CLIENT_ID:edugate-frontend}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${EDUGATE_OIDC_ISSUER:any}
# In Produktion ist "any" (Issuer-Prüfung effektiv deaktiviert) nicht akzeptabel: ein falsch
# konfigurierter oder kompromittierter Token-Aussteller würde sonst unbemerkt akzeptiert. Der
# %prod-Override erzwingt einen expliziten Issuer und lässt die Anwendung beim Start fehlschlagen,
# falls EDUGATE_OIDC_ISSUER nicht gesetzt ist (Issue #15). Dev/Test behalten den bequemen
# ":any"-Default von oben, da hier kein %dev./%test.-Override existiert.
%prod.quarkus.oidc.token.issuer=${EDUGATE_OIDC_ISSUER}
quarkus.oidc.token.principal-claim=preferred_username
# Discovery deaktiviert und Keycloak-Standardpfade explizit gesetzt: Ein anonymer Request muss
# ohne Netzwerkaufruf gegen Keycloak mit 401 beantwortet werden können (JWKS wird ohnehin erst
# beim ersten zu prüfenden Token benötigt, nicht beim Start oder bei unauthentifizierten Requests).
quarkus.oidc.discovery-enabled=false
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect
quarkus.oidc.end-session-path=/protocol/openid-connect/logout
# JWKS erst beim ersten zu prüfenden Token holen, nicht schon bei Tenant-Initialisierung /
# erstem (ggf. anonymem) Request - sonst schlägt ein Request ohne Token fehl, wenn Keycloak
# gerade nicht erreichbar ist, statt sauber mit 401 beantwortet zu werden.
quarkus.oidc.jwks.resolve-early=false
# Kein HTTP-Ebenen-Permission-Block: Schutz läuft ausschließlich über @RolesAllowed auf
# SchultraegerResource. Ein HTTP-Ebenen-Policy (quarkus.http.auth.permission.*) würde
# unauthentifizierte Requests bereits vor der JAX-RS-Ebene mit einer leeren 401-Antwort
# abweisen und damit unsere RFC7807-ExceptionMapper (UnauthorizedExceptionMapper) umgehen.

# --- SVWS-Verbindungstest-Ziele (SSRF-Schutz, Issue #17) -------------------
# Ohne explizite Freigabe lehnt SvwsTargetGuard Loopback-, Link-Local-, RFC1918- und ähnliche
# Sonder-Adressbereiche als Verbindungstest-Ziel ab. In Produktion muss der Betreiber die
# tatsächlichen SVWS-Zielnetze (ADR-007-Netzzonenkonzept) hier freigeben, z. B.
# "10.20.0.0/16" - siehe .env.example. Dev/Test erlauben der Einfachheit halber alle Ziele
# (u. a. für lokale SVWS-Testinstanzen im Docker-Netz).
edugate.svws.allowed-networks=${EDUGATE_SVWS_ALLOWED_NETWORKS:}
%dev.edugate.svws.allowed-networks=${EDUGATE_SVWS_ALLOWED_NETWORKS:0.0.0.0/0,::/0}
%test.edugate.svws.allowed-networks=${EDUGATE_SVWS_ALLOWED_NETWORKS:0.0.0.0/0,::/0}

# --- Health ------------------------------------------------------------
# Deckt "default" (edugate_control) ab; readiness prüft damit die DB-Erreichbarkeit.
quarkus.datasource.health.enabled=true

# --- CORS (lokale Frontend-Entwicklung, Vite auf 5173) ----------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${EDUGATE_FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
